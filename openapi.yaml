openapi: 3.0.3

info:
  title: Virtual AI Manager API
  version: 1.0.0
  description: API documentation for the Virtual AI Manager platform.

servers:
  - url: http://localhost:3000

tags:
  - name: Companies & Organization
  - name: Job Descriptions
  - name: Objectives
  - name: Missions
  - name: KPI

paths:

  /companies:
    post:
      tags:
        - Companies & Organization
      summary: Create a company
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyCreate'
            example:
              name: "3LM Solutions"
              sector: "Technology"
              plan: "premium"
      responses:
        '201':
          description: Company created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /companies/{id}/orgchart:
    get:
      tags:
        - Companies & Organization
      summary: Get company organization chart
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      responses:
        '200':
          description: Organization chart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgChart'
        '404':
          $ref: '#/components/responses/NotFound'

  /directions:
    post:
      tags:
        - Companies & Organization
      summary: Create a direction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectionCreate'
            example:
              companyId: "cmcompany123"
              name: "Direction Technique"
      responses:
        '201':
          description: Direction created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Direction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    get:
      tags:
        - Companies & Organization
      summary: Get company directions
      parameters:
        - name: companyId
          in: query
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: List of directions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Direction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /departments:
    post:
      tags:
        - Companies & Organization
      summary: Create a department
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentCreate'
            example:
              directionId: "cmdirection123"
              name: "Développement"
      responses:
        '201':
          description: Department created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    get:
      tags:
        - Companies & Organization
      summary: Get departments of a direction
      parameters:
        - name: directionId
          in: query
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: List of departments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Department'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /teams:
    post:
      tags:
        - Companies & Organization
      summary: Create a team
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamCreate'
            example:
              departmentId: "cmdepartment123"
              name: "Backend Team"
      responses:
        '201':
          description: Team created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    get:
      tags:
        - Companies & Organization
      summary: Get teams of a department
      parameters:
        - name: departmentId
          in: query
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: List of teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Team'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /employees:
    post:
      tags:
        - Companies & Organization
      summary: Create an employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeCreate'
            example:
              teamId: "cmteam123"
              name: "Employee 1"
              role: "Developer"
      responses:
        '201':
          description: Employee created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    get:
      tags:
        - Companies & Organization
      summary: Get employees of a team
      parameters:
        - name: teamId
          in: query
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: List of employees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Employee'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /job-descriptions:
    post:
      tags:
        - Job Descriptions
      summary: Create a job description
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobDescriptionCreate'
      responses:
        '201':
          description: Job description created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDescription'
        '400':
          $ref: '#/components/responses/BadRequest'

  /job-descriptions/{employeeId}:
    get:
      tags:
        - Job Descriptions
      summary: Get employee job description
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: string
        - name: companyId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job description
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDescription'
        '404':
          $ref: '#/components/responses/NotFound'

  /job-descriptions/{id}:
    patch:
      tags:
        - Job Descriptions
      summary: Update a job description
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobDescriptionCreate'
      responses:
        '200':
          description: Job description updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /objectives:
    post:
      tags:
        - Objectives
      summary: Create an objective
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObjectiveCreate'
            examples:
              strategic:
                value:
                  companyId: "cmcompany123"
                  level: "strategique"
                  title: "Improve company performance"
                  target:
                    value: 100
                    unit: "pourcent"
                    metric: "performance"
                  status: "en_cours"
              child:
                value:
                  companyId: "cmcompany123"
                  parentId: "cmobjective123"
                  level: "annuel"
                  title: "Increase annual revenue"
                  target:
                    value: 80
                    unit: "pourcent"
                    metric: "revenue"
                  status: "en_cours"
      responses:
        '201':
          description: Objective created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Objective'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

    get:
      tags:
        - Objectives
      summary: Get objectives
      parameters:
        - name: companyId
          in: query
          required: false
          schema:
            type: string
        - name: level
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ObjectiveLevel'
      responses:
        '200':
          description: Objectives
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Objective'
        '400':
          $ref: '#/components/responses/BadRequest'

  /objectives/tree/{strategicId}:
    get:
      tags:
        - Objectives
      summary: Get objective cascade tree
      parameters:
        - name: strategicId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Objective tree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectiveTree'
        '404':
          $ref: '#/components/responses/NotFound'

  /objectives/{id}/status:
    patch:
      tags:
        - Objectives
      summary: Update objective status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Objective status updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /missions:
    post:
      tags:
        - Missions
      summary: Create a mission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissionCreate'
            example:
              objectiveId: "cmobjective123"
              responsableId: "cmemployee123"
              teamId: "cmteam123"
              priorite: "haute"
              dependances: []
              livrables: []
              checklist: []
              dateLimite: "2026-09-30T00:00:00.000Z"
              kpi: []
              status: "a_faire"
              createdBy: "cmemployee123"
      responses:
        '201':
          description: Mission created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

    get:
      tags:
        - Missions
      summary: Get missions with filters
      parameters:
        - name: teamId
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/MissionStatus'
        - name: priorite
          in: query
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Missions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Mission'
        '400':
          $ref: '#/components/responses/BadRequest'

  /missions/{id}/status:
    patch:
      tags:
        - Missions
      summary: Update mission status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Mission status updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /missions/{id}/details:
    get:
      tags:
        - Missions
      summary: Get mission details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Mission details
        '404':
          $ref: '#/components/responses/NotFound'

  /kpi/define:
    post:
      tags:
        - KPI
      summary: Create KPI definition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KpiDefinitionCreate'
            example:
              companyId: "cmcompany123"
              name: "Revenue"
              unit: "montant"
              target: 100000
              description: "Monthly revenue"
      responses:
        '201':
          description: KPI definition created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KpiDefinition'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /kpi:
    get:
      tags:
        - KPI
      summary: Get KPIs for a company
      parameters:
        - name: companyId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: KPI definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KpiDefinition'
        '404':
          $ref: '#/components/responses/NotFound'

  /kpi/{kpiDefinitionId}/values:
    post:
      tags:
        - KPI
      summary: Record a KPI value
      parameters:
        - name: kpiDefinitionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KpiValueCreate'
            example:
              value: 85
              recordedAt: "2026-09-01T00:00:00.000Z"
              context:
                source: "manual"
      responses:
        '201':
          description: KPI value recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KpiValue'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /kpi/{id}/history:
    get:
      tags:
        - KPI
      summary: Get KPI history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: startDate
          in: query
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          schema:
            type: string
            format: date-time
        - name: granularity
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: KPI history
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /kpi/{id}/stats:
    get:
      tags:
        - KPI
      summary: Get KPI statistics
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: KPI statistics
        '404':
          $ref: '#/components/responses/NotFound'

components:

  parameters:
    CompanyId:
      name: id
      in: path
      required: true
      schema:
        type: string

    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 10

    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0

  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 400
            message: "Invalid request"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 404
            message: "Resource not found"

    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 409
            message: "Conflict"

    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 422
            message: "Validation failed"

  schemas:

    Error:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          type: string

    Company:
      type: object
      required:
        - id
        - name
        - sector
        - plan
      properties:
        id:
          type: string
        name:
          type: string
        sector:
          type: string
        plan:
          type: string

    CompanyCreate:
      type: object
      required:
        - name
        - sector
        - plan
      properties:
        name:
          type: string
        sector:
          type: string
        plan:
          type: string

    Direction:
      type: object
      required:
        - id
        - companyId
        - name
      properties:
        id:
          type: string
        companyId:
          type: string
        name:
          type: string

    DirectionCreate:
      type: object
      required:
        - companyId
        - name
      properties:
        companyId:
          type: string
        name:
          type: string

    Department:
      type: object
      required:
        - id
        - directionId
        - name
      properties:
        id:
          type: string
        directionId:
          type: string
        name:
          type: string

    DepartmentCreate:
      type: object
      required:
        - directionId
        - name
      properties:
        directionId:
          type: string
        name:
          type: string

    Team:
      type: object
      required:
        - id
        - departmentId
        - name
      properties:
        id:
          type: string
        departmentId:
          type: string
        name:
          type: string

    TeamCreate:
      type: object
      required:
        - departmentId
        - name
      properties:
        departmentId:
          type: string
        name:
          type: string

    Employee:
      type: object
      required:
        - id
        - teamId
        - name
        - role
      properties:
        id:
          type: string
        teamId:
          type: string
        name:
          type: string
        role:
          type: string
        managerId:
          type: string
          nullable: true

    EmployeeCreate:
      type: object
      required:
        - teamId
        - name
        - role
      properties:
        teamId:
          type: string
        name:
          type: string
        role:
          type: string
        managerId:
          type: string
          nullable: true

    JobDescription:
      type: object
      properties:
        id:
          type: string
        employeeRole:
          type: string
        mission:
          type: string
        objectifs:
          type: object
        responsabilites:
          type: object
        taches:
          type: object
        competences:
          type: object
        kpi:
          type: object
        livrables:
          type: object
        frequence:
          type: string
        risques:
          type: object
        procedures:
          type: object
        documents:
          type: array
          items:
            type: string

    JobDescriptionCreate:
      allOf:
        - $ref: '#/components/schemas/JobDescription'

    Objective:
      type: object
      required:
        - id
        - companyId
        - level
        - title
        - target
        - status
      properties:
        id:
          type: string
        companyId:
          type: string
        parentId:
          type: string
          nullable: true
        level:
          $ref: '#/components/schemas/ObjectiveLevel'
        title:
          type: string
        target:
          type: object
        status:
          type: string

    ObjectiveCreate:
      allOf:
        - $ref: '#/components/schemas/Objective'

    ObjectiveLevel:
      type: string
      enum:
        - strategique
        - annuel
        - trimestriel
        - mensuel
        - hebdomadaire
        - journalier

    ObjectiveTree:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        level:
          $ref: '#/components/schemas/ObjectiveLevel'
        children:
          type: array
          items:
            $ref: '#/components/schemas/ObjectiveTree'

    Mission:
      type: object
      required:
        - id
        - objectiveId
        - responsableId
        - priorite
        - dependances
        - livrables
        - checklist
        - dateLimite
        - kpi
        - status
        - createdBy
      properties:
        id:
          type: string
        objectiveId:
          type: string
        responsableId:
          type: string
        teamId:
          type: string
          nullable: true
        priorite:
          type: string
        dependances:
          type: array
          items:
            type: string
        livrables:
          type: object
        checklist:
          type: object
        dateLimite:
          type: string
          format: date-time
        kpi:
          type: object
        status:
          $ref: '#/components/schemas/MissionStatus'
        createdBy:
          type: string

    MissionCreate:
      allOf:
        - $ref: '#/components/schemas/Mission'

    MissionStatus:
      type: string
      enum:
        - a_faire
        - en_cours
        - terminee
        - en_retard

    KpiDefinition:
      type: object
      required:
        - id
        - companyId
        - name
        - unit
        - target
      properties:
        id:
          type: string
        companyId:
          type: string
        name:
          type: string
        unit:
          type: string
          enum:
            - pourcent
            - montant
            - nombre
            - temps
        target:
          type: number
        description:
          type: string
          nullable: true

    KpiDefinitionCreate:
      allOf:
        - $ref: '#/components/schemas/KpiDefinition'

    KpiValue:
      type: object
      required:
        - id
        - kpiDefinitionId
        - value
      properties:
        id:
          type: string
        kpiDefinitionId:
          type: string
        value:
          type: number
        recordedAt:
          type: string
          format: date-time
        context:
          type: object
          nullable: true

    KpiValueCreate:
      allOf:
        - $ref: '#/components/schemas/KpiValue'

    OrgChart:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          example: company
        children:
          type: array
          items:
            $ref: '#/components/schemas/OrgChartNode'

    OrgChartNode:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        children:
          type: array
          items:
            $ref: '#/components/schemas/OrgChartNode'